name: Check Watchlist Streaming Availability

on:
  schedule:
    # Run once a week every Friday at 13:00 UTC (9:00 AM EDT)
    # Day-of-week: 0 = Sun, 1 = Mon, ..., 5 = Fri, 6 = Sat
    - cron: '0 13 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (logs matches without sending email or saving DB)'
        required: false
        type: boolean
        default: false

jobs:
  check-streaming:
    name: Check Streaming Availability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore Alerts Database Cache
        uses: actions/cache@v4
        with:
          path: alerts.db
          key: alerts-db-${{ github.run_id }}
          restore-keys: |
            alerts-db-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alert Pipeline
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          STREAMING_SERVICES: ${{ secrets.STREAMING_SERVICES }}
          LETTERBOXD_USERNAME: ${{ secrets.LETTERBOXD_USERNAME || 'kclyde' }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          python main.py $FLAGS

